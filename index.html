function shatter(){setScene('<div style="position:absolute;inset:0;background:linear-gradient(135deg,#25384d,#05080f)"></div><svg id="cracks" class="crack" viewBox="0 0 1000 1800" preserveAspectRatio="none"></svg>');noise(.85,.22);scene.classList.add('shake');later(()=>scene.classList.remove('shake'),700);const svg=$('cracks'),cx=490,cy=780,paths=[];for(let n=0;n<42;n++){let a=n*Math.PI/21+(Math.random()-.5)*.3,len=380+Math.random()*900,d=`M ${cx} ${cy}`;for(let s=1;s<9;s++){let r=len*s/8;d+=` L ${(cx+Math.cos(a)*r+(Math.random()-.5)*55).toFixed(0)} ${(cy+Math.sin(a)*r+(Math.random()-.5)*55).toFixed(0)}`}paths.push(d)}for(let ring=1;ring<6;ring++){let d='';for(let j=0;j<=50;j++){let a=j/50*Math.PI*2,r=ring*80+(Math.random()-.5)*36;d+=(j?' L ':'M ')+(cx+Math.cos(a)*r)+' '+(cy+Math.sin(a)*r)}paths.push(d)}paths.forEach((d,i)=>later(()=>{if(!active)return;let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);svg.append(p)},i*14))}

function virus(){progress('THREAT DETECTED','Scanning memory...');let n=0;every(()=>{n++;$('progress').style.width=(n%100)+'%';$('status').textContent=`${n*17} suspicious objects identified`;if(n%4===0){const d=document.createElement('div');d.textContent='⚠ SECURITY ALERT · QUARANTINE FAILED';d.style.cssText=`position:absolute;left:${Math.random()*65}%;top:${Math.random()*75}%;padding:15px;background:#7e1528;border:2px solid white;font:700 13px monospace;box-shadow:0 10px 40px #000`;scene.append(d);later(()=>d.remove(),4500);sound(600,.15,'square')}} ,350)}
