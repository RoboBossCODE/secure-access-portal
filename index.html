<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f1d"><title>Secure Access Terminal</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#e9f2ff;background:#090f1d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 10%,#182a47,#090f1d 65%);display:grid;place-items:center}button,input{font:inherit}button{cursor:pointer}.panel{width:min(420px,calc(100vw - 30px));padding:26px;border:1px solid #31435e;border-radius:22px;background:#101a2bdc;box-shadow:0 25px 90px #0009}.head{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.14em;font-weight:800}.green{color:#65efcc}.status{color:#70e6b3;background:#153a35;padding:6px 9px;border-radius:20px}.lock{text-align:center;font-size:36px;margin-top:35px}h1{text-align:center;font-size:25px;margin:12px 0 6px}p.sub{text-align:center;color:#94a7c4;font-size:13px;margin-bottom:25px}.digits{display:flex;gap:10px;justify-content:center;margin-bottom:23px}.digit{width:57px;height:65px;display:grid;place-items:center;background:#17253a;border:1px solid #3a506c;border-radius:12px;font-size:27px;font-weight:700}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{height:56px;border-radius:12px;border:1px solid #34465f;background:#19283c;color:#eaf3ff;font-size:21px}.key:active{transform:scale(.96);background:#2b4261}.submit,.exit{width:100%;margin-top:14px;border:0;border-radius:12px;background:#55d7bc;color:#092329;font-weight:800;padding:16px}.submit:disabled{opacity:.45;cursor:not-allowed}.hint{text-align:center;color:#7388a4;font-size:11px;margin:20px 0 0}.error{color:#ff9b9b;text-align:center;min-height:20px;font-size:13px;margin-top:9px}.overlay{position:fixed;inset:0;z-index:20;overflow:hidden;background:#05070e;color:white;display:none}.overlay.active{display:block}.close{position:fixed;z-index:100;right:15px;top:max(15px,env(safe-area-inset-top));background:#101b2ce8;border:1px solid #7c91a9;color:white;border-radius:999px;padding:10px 15px;font-size:13px}.scene{width:100%;height:100%;display:grid;place- e:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(prefers-reduced-motion:reduce){.shake,.glitch,.disco,.rick .singer{animation:none}}
#exitGate:not([hidden]){position:fixed;inset:0;z-index:110;background:#030713ed;display:grid;place-items:center;padding:20px}.gateBox{width:min(360px,100%);padding:25px;border:1px solid #506580;border-radius:18px;background:#121e31;text-align:center}.gateBox input{width:100%;padding:14px;font-size:24px;letter-spacing:.5em;text-align:center;border-radius:10px;background:#0b1423;color:white;border:1px solid #60748c}.gateBox button{margin:14px 5px 0;padding:11px 18px;border-radius:9px;border:1px solid #60748c;background:#263e56;color:white}.gateBox #gateError{color:#ff9b9b;min-height:1.2em}.close{font-size:19px;padding:9px 12px}</style></head><body><main class="panel" id="panel"><div class="head"><span class="green">⬡ SECURE ACCESS</span><span class="status">● ONLINE</span></div><div class="lock">🔒</div><h1>Enter Access Code</h1><p class="sub">Enter your 4-digit security PIN to continue.</p><div class="digits" aria-label="PIN entry"><div class="digit">–</div><div class="digit">–</div><div class="digit">–</div><div class="digit">–</div></div><div class="keys" id="keys"></div><button class="submit" id="submit" disabled>UNLOCK →</button><div class="error" id="error" role="status"></div><p class="hint">SECURE TERMINAL · VERSION 1.0</p></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Prank experience"><div class="scene" id="scene"></div></div><script>
'use strict';const codes={'0000':['Code Directory','Browse all available pranks'],'7392':['Jumpscare','Sudden spooky face and sound'],'4618':['Rickroll','An original in-page singalong parody'],'8253':['System Error','Fake error and diagnostic sequence'],'2947':['Self Destruct','Dramatic 60-second countdown'],'5831':['Matrix Takeover','Animated digital rain'],'9062':['Haunted Terminal','Creepy messages and flickering'],'1479':['Fake Windows Update','Simulated update stuck at 99%'],'6384':['Infinite Loading','Progress that never completes'],'3726':['Disco Mode','Colourful lights and synthesized music'],'8519':['Shattered Screen','Cracks spread across the viewport']};
let pin='',timers=[],audio=null,active=false;const $=id=>document.getElementById(id),digits=[...document.querySelectorAll('.digit')];function draw(){digits.forEach((d,i)=>d.textContent=pin[i]||'–');$('submit').disabled=pin.length!==4}function key(k){$('error').textContent='';if(k==='C')pin='';else if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;draw()}for(const k of ['1','2','3','4','5','6','7','8','9','C','0','⌫']){const b=document.createElement('button');b.className='key';b.textContent=k;b.setAttribute('aria-label',k==='C'?'Clear':k==='⌫'?'Backspace':k);b.onclick=()=>key(k);$('keys').append(b)}document.addEventListener('keydown',e=>{if(active)returnif(/^\d$/.test(e.key))key(e.key);if(e.key==='Backspace')key('⌫');if(e.key==='Escape')key('C');if(e.key==='Enter')unlock()});$('submit').onclick=unlock;function unlock(){if(pin.length!==4)return;if(!codes[pin]){$('error').textContent='ACCESS DENIED · Invalid code';pin='';draw();return}start(pin)}function later(fn,ms){const t=setTimeout(fn,ms);timers.push(['timeout',t]);return t}function every(fn,ms){const t=setInterval(fn,ms);timers.push(['interval',t]);return t}function tone(freq=440,dur=.15,type='sine',volume=.1){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}function noise(dur=.8){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const b=audio.createBuffer(1,Math.floor(audio.sampleRate*dur),audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const src=audio.createBufferSource(),gain=audio.createGain();gain.gain.value=.22;src.buffer=b;src.connect(gain);gain.connect(audio.destination);src.start()}catch{}}function stop(){ active=false;timers.forEach(([kind,id])=>kind==='interval'?clearInterval(id):clearTimeout(id));timers=[];if(audio){audio.close().catch(()=>{});audio=null}$('overlay').classList.remove('active');$('scene').className='scene';$('scene').replaceChildren();document.body.style.overflow='';pin='';draw();$('error').textContent=''}function setScene(html,cls=''){$('scene').className='scene '+cls;$('scene').innerHTML=html}function start(code){if(active)stop();active=true;$('overlay').classList.add('active');document.body.style.overflow='hidden';switch(code){case '0000':directory();break;case '7392':jump();break;case '4618':rick();break;case '8253':errorPrank();break;case '2947':countdown();break;case '5831':matrix();break;case '9062':haunted();break;case '1479':update();break;case '6384':loading();break;case '3726':disco();break;case '8519':shatter();break;}}
function directory(){setScene('<div class="directory"><h2>🔐 Code Directory</h2><p>Tap LAUNCH to preview a prank.</p><div id="entries"></div></div>');const el=$('entries');const back=document.createElement('button');back.textContent='EXIT';back.onclick=stop;back.style.marginBottom='16px';el.append(back);for(const [code,[name,desc]] of Object.entries(codes)){const row=document.createElement('div');row.className='entry';const label=document.createElement('span');label.innerHTML='<code>'+code+'</code> · <b>'+name+'</b><br><span class="small">'+desc+'</span>';row.append(label);if(code!=='0000'){const btn=document.createElement('button');btn.textContent='LAUNCH';btn.onclick=()=>start(code);row.append(btn)}el.append(row)}}
function jump(){setScene('<div><div class="face" aria-label="scary face">👹</div><h2 class="red">BOO!</h2><p>YOU HAVE BEEN PRANKED</p></div>','jumpscare shake');noise(.9);tone(75,.7,'sawtooth',.25);later(()=>{$('scene').classList.remove('shake')},900)}

function matrix(){setScene('<canvas id="rain" style="position:absolute;inset:0;width:100%;height:100%"></canvas><div style="position:relative;z-index:1;background:#000b;padding:22px;border:1px solid #3f8"><h2 class="glitch">ACCESS GRANTED</h2><p>THE MATRIX HAS YOU</p></div>');const c=$('rain'),ctx=c.getContext('2d');let cols=[],w,h;function resize(){w=c.width=innerWidth;h=c.height=innerHeight;cols=Array.from({length:Math.ceil(w/17)},()=>Math.random()*h/17)}resize();window.addEventListener('resize',resize,{once:true});every(()=>{ctx.fillStyle='#0002';ctx.fillRect(0,0,w,h);ctx.font='16px monospace';ctx.fillStyle='#35ff80';cols.forEach((y,i)=>{ctx.fillText(Math.random()>.5?'1':'0',i*17,y*17);cols[i]=y*17>h&&Math.random()>.975?0:y+1})},55)}

function shatter(){setScene('<div style="position:absolute;inset:0;background:linear-gradient(135deg,#18283c,#060a10);display:grid;place-items:center"><div style="font-size:65px;opacity:.45">📱</div></div><svg class="crack" id="cracks" viewBox="0 0 1000 1800" preserveAspectRatio="none" aria-label="Simulated cracked glass"></svg><div style="position:relative;z-index:2;pointer-events:none;text-shadow:0 2px 10px #000"><h2>SCREEN DAMAGE DETECTED</h2><p>Just a visual prank. Your screen is fine!</p></div>');noise(.85);$('scene').classList.add('shake');later(()=>$('scene').classList.remove('shake'),650);const svg=$('cracks'),cx=480,cy=760;let paths=[];const rand=(a,b)=>a+Math.random()*(b-a);for(let n=0;n<32;n++){const ang=n*Math.PI*2/32+rand(-.14,.14),len=rand(380,1300),steps=7;let x=cx,y=cy,d=`M ${x} ${y}`;for(let s=1;s<=steps;s++){let r=len*s/steps;x=cx+Math.cos(ang)*r+rand(-28,28);y=cy+Math.sin(ang)*r+rand(-28,28);d+=` L ${x.toFixed(1)} ${y.toFixed(1)}`;if(s>2&&s<6&&n%2===0){const a=ang+rand(.3,1);paths.push(`M ${x} ${y} l ${Math.cos(a)*rand(40,150)} ${Math.sin(a)*rand(40,150)}`)}}paths.push(d)}for(let ring=1;ring<=5;ring++){let d='';for(let n=0;n<=40;n++){const a=n/40*Math.PI*2,r=ring*75+rand(-24,24),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;d+=(n?' L ':'M ')+x+' '+y}paths.push(d)}paths.forEach((d,i)=>later(()=>{if(!active||!$('cracks'))return;const ns='http://www.w3.org/2000/svg',p=document.createElementNS(ns,'path');p.setAttribute('d',d);svg.append(p)},i*13))}
