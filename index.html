function improvedPixels(){setScene('<div class="oled-black"><div class="oled-bruise" id="bruise"></div><div class="oled-streak" id="streak"></div><div class="oled-cluster" id="clusters"></div></div>','oled-scene');let n=0;every(()=>{n++;let e=document.createElement('span');e.className='dead-cluster';e.style.left=(10+Math.random()*80)+'%';e.style.top=(5+Math.random()*90)+'%';e.style.width=(5+Math.random()*40)+'px';e.style.height=(2+Math.random()*90)+'px';$('clusters').append(e);if(n>10)$('bruise').style.transform=`scale(${1+(n-10)*.12})`;if(n>18)$('streak').style.opacity='.9';if(n>35)$('clusters').style.filter='brightness(.35)'},500)}

 else if(/Checkbox|Button|Login Form|Menu|PIN|Verification|CAPTCHA|Quiz|Answers/.test(n)){zone.innerHTML='<div class="button-field" id="buttonField"><button id="escapeButton">CONTINUE</button></div>';let b=$('escapeButton');b.onclick=()=>{bump(['Incorrect selection.','Verification expired.','Please try again.','Challenge updated.'][tries%4]);b.style.transform=`translate(${Math.round(Math.random()*150-75)}px,${Math.round(Math.random()*120-60)}px)`;b.textContent=['CONFIRM','VERIFY','NEXT','SUBMIT'][tries%4]};}

  every(()=>{step++;p=Math.min(99,p+(step%5===0?1:3));$('diagFill').style.width=p+'%';$('diagPercent').textContent=p+'%';$('diagStage').textContent=diag[Math.floor(step/7)%4];$('diagValue').textContent=isTemp?(43+step*2)+'°C':isNet?'LINK FAILED / RETRY '+step:isDisplay?'FRAME ERROR '+String(step).padStart(4,'0'):'STATUS 0x'+(0xC0000000+step*19).toString(16).toUpperCase();if(step%3===0){let line=document.createElement('div');line.textContent=`[${String(step).padStart(3,'0')}] ${diag[step%4]} ... ${step%4===0?'FAILED':'CHECKING'}`;$('diagLog').append(line);if($('diagLog').children.length>6)$('diagLog').firstChild.remove()}if(p>=99){p=0;$('diagStage').textContent='RESTARTING DIAGNOSTICS'}},620);return;
 }
 return expanded(item)
